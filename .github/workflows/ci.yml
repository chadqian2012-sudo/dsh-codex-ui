name: Validate plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:distribution
      - if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test/install.test.ps1
      - if: runner.os == 'Windows'
        run: npm run test:publish
      - if: runner.os == 'Windows'
        run: npm run test:zip
